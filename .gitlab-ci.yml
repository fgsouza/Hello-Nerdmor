# GitLab CI: compila o APK "Hello World" do Nerdmor.
# O APK fica disponível em: Build > Pipelines > (job) > Artifacts.
image: eclipse-temurin:17-jdk

variables:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "34.0.0"
  # https://developer.android.com/studio#command-line-tools-only
  ANDROID_CMDLINE_TOOLS: "11076708"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: android-sdk-$ANDROID_COMPILE_SDK-$ANDROID_BUILD_TOOLS
  paths:
    - .android-sdk/
    - .gradle/caches/
    - .gradle/wrapper/

stages:
  - build

before_script:
  - apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
  - |
    if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
      mkdir -p "$ANDROID_HOME/cmdline-tools"
      wget -q "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip" -O /tmp/cmdline-tools.zip
      unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    fi
  - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
  - chmod +x ./gradlew

assembleDebug:
  stage: build
  script:
    - ./gradlew --no-daemon assembleDebug
    - cp app/build/outputs/apk/debug/app-debug.apk nerdmor-hello-world.apk
  artifacts:
    name: "nerdmor-hello-world-$CI_COMMIT_SHORT_SHA"
    paths:
      - nerdmor-hello-world.apk
    expire_in: 30 days
